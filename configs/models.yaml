llm:
  backend: gemini  # ollama | lm_studio | llamacpp | gemini
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:14b"
    timeout_seconds: 600
  lm_studio:
    base_url: "http://localhost:1234"
    model: "local-model"
    timeout_seconds: 600
  llamacpp:
    base_url: "http://localhost:8080"
    model: "unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL"
    timeout_seconds: 600
  gemini:
    model: "gemini-flash-lite-latest"   # free tier — use this alias if 2.x models hit quota 0
    max_tokens: 4096
    timeout_seconds: 60
    api_key: ""   # set GEMINI_API_KEY env var instead — never put key here
  temperature: 0.2
  max_tokens: 4096
