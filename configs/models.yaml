llm:
  backend: llamacpp  # ollama | lm_studio | llamacpp | gemini
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:14b"
    timeout_seconds: 600
  lm_studio:
    base_url: "http://localhost:1234"
    model: "local-model"
    timeout_seconds: 600
  llamacpp:
    base_url: "http://localhost:8080"
    model: "unsloth/gemma-4-26B-A4B-it-GGUF:UD-Q4_K_XL"
    timeout_seconds: 600
  gemini:
    model: "gemini-2.0-flash"   # free tier: 1,500 req/day, 15 RPM
    max_tokens: 4096
    timeout_seconds: 60
    # API key: set GEMINI_API_KEY in environment (https://aistudio.google.com/apikey)
  temperature: 0.2
  max_tokens: 4096
