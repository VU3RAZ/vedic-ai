# Google Cloud Build — build image and deploy to Cloud Run
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _REGION=asia-south1,_SERVICE=vedic-ai .
#
# Or just:  make deploy   (wraps the above)
#
# Required substitution variables (set via --substitutions or Cloud Build triggers):
#   _REGION  — Cloud Run region  (default: asia-south1 = Mumbai)
#   _SERVICE — Cloud Run service name (default: vedic-ai)

substitutions:
  _REGION: asia-south1
  _SERVICE: vedic-ai
  _IMAGE: gcr.io/$PROJECT_ID/${_SERVICE}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # faster image build

steps:
  # 1. Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=${_IMAGE}:$SHORT_SHA
      - --tag=${_IMAGE}:latest
      - --cache-from=${_IMAGE}:latest
      - .

  # 2. Push both tags
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}:$SHORT_SHA]
  - name: gcr.io/cloud-builders/docker
    args: [push, ${_IMAGE}:latest]

  # 3. Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --concurrency=4
      - --timeout=300
      - --set-env-vars=GEMINI_API_KEY=$$GEMINI_API_KEY,HF_HUB_OFFLINE=1
    secretEnv: [GEMINI_API_KEY]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: GEMINI_API_KEY

images:
  - ${_IMAGE}:$SHORT_SHA
  - ${_IMAGE}:latest
